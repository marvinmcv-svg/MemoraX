# Web service config — see RAILWAY.md for the per-service deploy workflow.
[build]
builder = "DOCKERFILE"
dockerfilePath = "../../Dockerfile.web"

[build.env]
NODE_ENV = "production"

[deploy]
startCommand = "npx next start -p 3000"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
